name: bigdogg_app
description: "BigDogg - Smart invoicing for Dutch ZZP'ers"
publish_to: 'none'
version: 1.0.0+12

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  http_parser: ^4.0.2
  shared_preferences: ^2.2.2
  go_router: ^13.2.0
  url_launcher: ^6.2.4
  provider: ^6.1.2
  supabase_flutter: ^2.12.2
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  qr_flutter: ^4.1.0
  speech_to_text: ^7.0.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.0.1
  # Native share sheet for the PDF transactions report on mobile
  # (web uses an in-browser download via dart:html instead).
  printing: ^5.13.0
  # Open a downloaded PDF directly in the device's default viewer
  # (ACTION_VIEW) instead of the share sheet. path_provider gives a temp dir.
  path_provider: ^2.1.0
  open_filex: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  hive_generator: ^2.0.1
  build_runner: ^2.4.0

# Android launcher icon generation.
# Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  # iOS icons must be opaque (no alpha) or App Store rejects them.
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  image_path: "assets/images/logo.png"
  background_color: "#FFFFFF"
  adaptive_icon_background: "#FFFFFF"
  # Padded version of the logo so Android's adaptive-icon mask doesn't
  # crop the "BigDogg" text at the bottom.
  adaptive_icon_foreground: "assets/images/logo_padded.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
    - family: MaterialIcons
      fonts:
        - asset: assets/fonts/MaterialIcons-Regular.otf
